def gitCommitHash = { ->
    try {
        ExecOutput result = providers.exec {
            commandLine = ['git', 'rev-parse', '--short', 'HEAD']
            ignoreExitValue = true
        }

        if (result.getResult().get().getExitValue() != 0) {
            return "<UnknownCommit>";
        } else {
            return result.standardOutput.asText.get().strip();
        }
    } catch (Exception e) {
        e.printStackTrace()
        return "<UnknownCommit>";
    }
}

def buildtime = {System.currentTimeSeconds()}
def buildLabel = providers.gradleProperty('buildLabel').getOrElse("local-${gitCommitHash()}-${System.currentTimeMillis()}")
def identityDirectory = layout.buildDirectory.dir('generated/build-identity')
def identitySources = files(fileTree('src/main'), fileTree('native/metal') {
    exclude 'build/**'
}, fileTree('tools') { exclude '__pycache__/**' }, 'build.gradle', 'gradle.properties',
        'gradle/wrapper/gradle-wrapper.properties')
tasks.register('generateBuildIdentity') {
    dependsOn tasks.named('buildMetalNative')
    inputs.files(identitySources)
    inputs.property('label', buildLabel)
    outputs.dir(identityDirectory)
    doLast {
        def digest = java.security.MessageDigest.getInstance('SHA-256')
        identitySources.files.findAll { it.isFile() }.sort { a, b -> a.path <=> b.path }.each { source ->
            digest.update(project.relativePath(source).getBytes(java.nio.charset.StandardCharsets.UTF_8))
            digest.update((byte) 0)
            digest.update(source.bytes)
            digest.update((byte) 0)
        }
        def output = identityDirectory.get().file('voxy-build.json').asFile
        output.parentFile.mkdirs()
        output.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson([
                label: buildLabel, sourceDigest: digest.digest().encodeHex().toString(),
                commit: gitCommitHash(), upstreamTarget: '59b62bee821518e06612e1d5c2c58c487bda761d'
        ])) + '\n'
    }
}

processResources {
    def time = buildtime()
    def hash = gitCommitHash()
    def version = project.version

    dependsOn tasks.named('generateBuildIdentity')
    from(identityDirectory)
    inputs.properties("version": version, "commit": hash, "buildtime": time, "buildLabel": buildLabel)
    filesMatching("fabric.mod.json") {
        expand "version": version, "commit": hash, "buildtime": time, "buildLabel": buildLabel
    }
}


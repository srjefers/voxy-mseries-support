// Run CPU and driver regressions explicitly; GPU checks require an Apple-Silicon Mac.
tasks.named('test', Test) {
    // Standalone JavaExec regressions are run by verifyCpu/verifyMetal; no JUnit suite is declared.
    failOnNoDiscoveredTests = false
}
tasks.register('verifyCpu') {
    group = 'verification'
    description = 'CPU regressions for storage, meshing, allocation, lifecycle, uniforms and frame ownership.'
    dependsOn 'testUpstreamCpu', 'testStorage', 'testCompression', 'testNativeOwnership',
            'testStorageConfig', 'testIngestionLayout', 'testMeshing', 'testAllocation',
            'testAsync', 'testClientFeatures', 'testClientSession', 'testCoverage',
            'testDrawCoverage', 'testFrameHistory', 'testProjection', 'testSectionProbe',
            'testDiagnosticWindow', 'testShaderLoading', 'testMaterialUniforms',
            'testIrisUniforms', 'testWaterFrames', 'testBslSourcePatchScope', 'testBslAssembly'
}
tasks.register('verifyMetal') {
    group = 'verification'
    description = 'On-device GL/Metal regressions, including actual Complementary programs; use -PcomplementaryPack.'
    dependsOn 'testGlInterop', 'testMetalResolve', 'testMetalBake', 'testMetalTerrainPipelines',
            'testMetalTraversal', 'testWaterDepthBridge', 'testMaterialContract'
}

// -------- Shader compiler smoke test --------
// Runs me.cortex.voxy.tools.ShaderCompilerSmokeTest against the on-disk shader
// tree to validate that GLSL -> SPIRV -> MSL works for a representative slice
// of Voxy's shaders (incl. cmdgen.comp with injected runtime defines and
// hiz.comp with subgroup ops). Used to gate M1 progress before wiring the
// compiler into the Metal/Vulkan backends.
tasks.register('testShaderCompiler', JavaExec) {
    group = 'verification'
    description = 'Smoke-test RuntimeShaderCompiler against representative Voxy shaders.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'me.cortex.voxy.tools.ShaderCompilerSmokeTest'
    workingDir = rootProject.projectDir
    standardOutput = System.out
    errorOutput = System.err
}

// H6 verification: JomlCompat's LWJGL writes against JOML's own get(ByteBuffer), byte for byte, and
// getToAddress where it works. -PtestJava=launcher runs it on the launcher's Java 21 (where JOML's
// getToAddress throws on macOS); -PtestJava=<path to bin/java> on any other JVM.
tasks.register('testJomlCompat', JavaExec) {
    group = 'verification'
    description = 'Smoke-test JomlCompat: LWJGL writes vs JOML, byte for byte (H6).'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'me.cortex.voxy.tools.JomlCompatSmokeTest'
    workingDir = rootProject.projectDir
    standardOutput = System.out
    errorOutput = System.err
    def testJava = project.findProperty("testJava")
    if (testJava) {
        def exe = testJava == "launcher" ? launcherJava21 : file(testJava)
        executable = exe.absolutePath
        doFirst {
            if (!exe.canExecute()) {
                throw new GradleException("-PtestJava=${testJava}: no java executable at ${exe}")
            }
        }
    }
}


['testAsync': 'AsyncRegressionTest', 'testClientFeatures': 'ClientFeatureRegressionTest', 'testClientSession': 'ClientSessionRegressionTest'].each { taskName, testClass ->
    tasks.register(taskName, JavaExec) {
        group = 'verification'
        dependsOn testClasses
        classpath = sourceSets.test.runtimeClasspath
        mainClass = taskName == 'testAsync' ? "me.cortex.voxy.client.core.rendering.hierachical.${testClass}" : "me.cortex.voxy.client.core.rendering.${testClass}"
        doFirst { jvmArgs "-javaagent:${configurations.mockitoAgent.singleFile}" }
    }
}


loom {
    accessWidenerPath = file("src/main/resources/voxy.accesswidener")
    // Headless-ish debug loop: VOXY_QUICKPLAY="<world folder>" auto-joins a
    // singleplayer world on launch so diagnostics can be captured from logs
    // without manual menu interaction.
    runs {
        client {
            if (System.getenv("VOXY_QUICKPLAY") != null) {
                programArgs("--quickPlaySingleplayer", System.getenv("VOXY_QUICKPLAY"))
            }
            // Optional heap cap for dev runs, to measure what a launcher profile with -Xmx sees:
            // ./gradlew runClient -PrunXmx=6G (VOXY_RUN_XMX=6G works too). Without it the JVM default
            // applies (25% of RAM, 12 GB on a 48 GB Mac) and Activity Monitor shows a larger process.
            def runXmx = project.findProperty("runXmx") ?: System.getenv("VOXY_RUN_XMX")
            if (runXmx) {
                vmArg("-Xmx${runXmx}")
            }
        }
    }
}

// The dev client's JVM. Players run 1.21.11 on the launcher's Java 21; runClient used to run on the
// JVM that runs Gradle (JDK 27 on the reference Mac), and that hid H6 (JOML's getToAddress throws on
// macOS Java 21 only).
//   (unset)            the launcher's Java 21 (launcherJava21), or a JDK 21 toolchain if it is missing
//   -PrunJava=<N>      an installed JDK N found by Gradle toolchains; 27 = the JDK runClient used before
//   -PrunJava=<path>   any java binary
def runJava = (project.findProperty("runJava") ?: "").toString().trim()
tasks.named { it == 'runClient' }.configureEach { task ->
    String jvm
    if (runJava.isEmpty() && launcherJava21.canExecute()) {
        task.executable = launcherJava21.absolutePath
        jvm = "the official launcher's Java 21, ${launcherJava21}"
    } else if (runJava.isEmpty() || runJava ==~ /\d+/) {
        int version = runJava.isEmpty() ? 21 : (runJava as int)
        task.javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(version) }
        jvm = "a JDK ${version} toolchain"
    } else {
        def exe = file(runJava)
        task.executable = exe.absolutePath
        jvm = exe.absolutePath
    }
    def irisNote = noIris ? ", without Iris (-PnoIris=true)" : ""
    task.doFirst { logger.lifecycle(">>> runClient JVM: ${jvm}${irisNote}") }
}

// The release jar, run the way a launcher runs it (Loom's ClientProductionRunTask): the vanilla
// client on intermediary names through Fabric Loader's KnotClient, the remapped jar from remapJar,
// Fabric API and Sodium 0.8.1 from productionRuntimeMods, no Iris, Java 21, no Voxy JVM arguments
// (Metal is on by default), game folder run/. It shows what runClient cannot: code that looks up a
// Minecraft member by its Mojang name works in runClient and fails here (H7). VOXY_QUICKPLAY and
// -PrunXmx work as for runClient; -PforceMetal=false passes -Dvoxy.forceMetal=false (the kill switch).
// Java 21 is found by Gradle toolchains: the JVM that runs Gradle when it is a 21.
dependencies {
    // Not transitive: the fabric-api jar nests its modules (jar-in-jar), as in a launcher's mods folder.
    productionRuntimeMods("net.fabricmc.fabric-api:fabric-api:${project.fabric_version}") { transitive = false }
    productionRuntimeMods("maven.modrinth:sodium:mc1.21.11-0.8.1-fabric") { transitive = false }
}
tasks.register('runProductionClient', net.fabricmc.loom.task.prod.ClientProductionRunTask) {
    group = 'fabric'
    description = 'Runs the release jar like a launcher: intermediary names, Fabric API, Sodium, no Iris, Java 21.'
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(21) }
    def forceMetal = project.findProperty("forceMetal")
    if (forceMetal) {
        jvmArgs.add("-Dvoxy.forceMetal=${forceMetal}")
    }
    def xmx = project.findProperty("runXmx") ?: System.getenv("VOXY_RUN_XMX")
    if (xmx) {
        jvmArgs.add("-Xmx${xmx}")
    }
    def world = System.getenv("VOXY_QUICKPLAY")
    if (world) {
        programArgs.addAll("--quickPlaySingleplayer", world)
    }
}

